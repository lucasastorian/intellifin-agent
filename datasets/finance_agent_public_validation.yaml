  # Question 040 - ABNB EBITDA adjustments (OUTDATED)
  - id: "040"
    question: "What adjustments does Airbnb (NASDAQ: ABNB) make to its Net Income to Derive Adjusted EBITDA?"
    ticker: "ABNB"
    ground_truth: |
      Provision for income taxes;
      Other expense, net;
      Interest income;
      Depreciation and amortization;
      Stock-based compensation expense;
      Acquisition-related impacts consisting of gains (losses) recognized on changes in the fair value of contingent consideration arrangements;
      Lodging taxes for which we may have joint and several liability with hosts for collecting and remitting such taxes, withholding taxes on payments made to hosts and any related settlements, and transactional taxes where there is significant uncertainty as to how the taxes apply to our platform; and
      Stock-settlement obligations, which represent employer and related taxes related to the IPO.
    original_ground_truth: |
      Provision for (benefit from) income taxes;
      Other income (expense), net;
      Interest income;
      Depreciation and amortization;
      Stock-based compensation expense;
      Acquisition-related impacts consisting of gains (losses) recognized on changes in the fair value of contingent consideration arrangements, and
      Lodging taxes, withholding taxes, and transactional taxes where there is significant uncertainty as to how the taxes apply to our platform.
    issue_type: "outdated"
    issue_notes: "Original answer had abbreviated tax adjustment language (missing details about joint/several liability and host payment settlements) AND is missing 'stock-settlement obligations' adjustment that Airbnb added in Q2 2025 10-Q. Updated to current Q2 2025 10-Q definition (filed August 2025)."
