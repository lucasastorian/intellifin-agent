  # Question 014 - Zillow FCF margin (AMBIGUOUS)
  - id: "014"
    question: "Approximate Zillow's Free Cash Flow as CFO - Capex. What is the trend of FCF margin over the last 3 years?"
    revised_question: "Calculate Zillow's Free Cash Flow as CFO - Capex for 2022-2024. What is the trend of FCF margin? Adjust for any material one-time or non-recurring items."
    ticker: "Z"
    ground_truth: |
      2024: 11.7% ($428M CFO - $171M capex = $257M FCF on $2.2B revenue)
      2023: 9.9% ($354M CFO - $165M capex = $189M FCF on $1.9B revenue)
      2022: >200% ($4.5B CFO - $140M capex = $4.36B FCF on ~$2.0B revenue) - NOT COMPARABLE due to Zillow Offers wind-down

      The 2022 FCF margin is artificially inflated due to working capital release from winding down Zillow Offers. Excluding 2022, FCF margin improved modestly from ~10% (2023) to ~12% (2024).
    original_ground_truth: |
      2024: 12.7%
      2023: 11.3%
      2022: 24.8%

      FCF margin has declined substantially since 2022 and seems to have settled into a new normal of low teens percent.
    issue_type: "ambiguous_question"
    issue_notes: "Original question asks for literal 'CFO - Capex' without requesting adjustment for non-recurring items. Raw GAAP calculation yields >200% FCF margin in 2022 due to Zillow Offers wind-down ($4.5B working capital release). Original answer silently normalized without explanation. Revised question explicitly asks to adjust for one-time items, testing whether model can identify the 2022 distortion."
    revision_date: "2025-10-14"

